services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: memties
      MYSQL_USER: memties
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the deployment environment}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  app:
    command: ["sh", "-c", "node dist/db/migrate.js && exec node dist/index.js"]
    build:
      context: .
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-localhost,127.0.0.1,::1,db}
    volumes:
      - type: bind
        source: ${APP_ENV_FILE:-/opt/memties/.env}
        target: /app/backend/.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${APP_CERTIFICATE_DIR:-/opt/memties/certificate}
        target: /app/backend/certificate
        read_only: true
        bind:
          create_host_path: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      SERVE_FRONTEND: "true"
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1,db}
      NODE_USE_ENV_PROXY: "1"
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL to mysql://memties:URL_ENCODED_PASSWORD@db:3306/memties}
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql_data:
